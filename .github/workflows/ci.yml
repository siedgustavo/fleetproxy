name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: fleetproxy
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Los integration tests spawnean el motor empaquetado (opencode-ai);
      # el chat live queda skip si no se setea FLEETPROXY_LIVE_CHAT.
      - run: bun test
